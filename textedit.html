
<!DOCTYPE html>
<html>
<head>
	<title>Text Editor</title>
	<style>
		body {
			font-family: Arial, sans-serif;
		}
		
		.text-editor {
			width: 80%;
			height: 500px;
			margin: 40px auto;
			padding: 20px;
			border: 1px solid #ccc;
			border-radius: 10px;
			box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
		}
		
		.back-button {
			position: fixed;
			bottom: 20px;
			left: 20px;
			background-color: #4CAF50;
			color: #fff;
			padding: 10px 20px;
			border: none;
			border-radius: 5px;
			cursor: pointer;
		}
		
		.back-button:hover {
			background-color: #3e8e41;
		}
	</style>
</head>
<body>
	<div class="text-editor">
		<textarea id="editor" style="width: 100%; height: 100%;"></textarea>
	</div>
	
	<button class="back-button" onclick="window.location.href='https://abceveryone.github.io'">Back</button>
	
	<script>
		// You can add text editor functionality here using JavaScript
	</script>
</body>
</html>
