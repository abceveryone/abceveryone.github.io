<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToolDIY</title>
    <style>
        * {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f4f4f4;
        }
        .popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            text-align: center;
            display: block;
        }
        .popup img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
        }
        .popup h2 {
            margin: 10px 0;
        }
        .popup button {
            background: #ff0000;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 10px;
        }
        .popup button:hover {
            background: #cc0000;
        }
    </style>
</head>
<body>

    <div id="popup" class="popup">
        <img src="profile.jpg" alt="Profile Picture">
        <h2>@ivaansri1359</h2>
        <p>Subscribers: <strong>16K</strong></p>
        <p>Views: <strong>3M</strong></p>
        <button onclick="viewChannel()">View Channel</button>
    </div>

    <script>
        function viewChannel() {
            window.open("https://www.youtube.com/@ivaansri1359", "_blank");
        }
    </script>

</body>
</html>
