<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooldiy Login</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            font-family: Arial, sans-serif;
            margin: 0;
        }
        .login-box {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        h1 {
            margin-bottom: 20px;
        }
        button {
            background-color: #4285F4;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #357ae8;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h1>Login to Tooldiy</h1>
        <button id="login">Login with Google</button>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-auth.js";

        // Firebase Config (Replace with yours)
        const firebaseConfig = {
            apiKey: "AIzaSyCbwlEKSpafGS7wpiNhyA-iFsRoutQ66ag",
            authDomain: "tooldiy-7f7ca.firebaseapp.com",
            projectId: "tooldiy-7f7ca",
            storageBucket: "tooldiy-7f7ca.firebasestorage.app",
            messagingSenderId: "631428738593",
            appId: "1:631428738593:web:b38a813d10cbfcd626fd60"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth();
        const provider = new GoogleAuthProvider();

        // Login with Google
        document.getElementById("login").addEventListener("click", () => {
            signInWithPopup(auth, provider)
                .then(() => {
                    // Redirect after login
                    window.location.href = "https://your-redirect-site.com"; // Change this
                })
                .catch((error) => {
                    console.error("Login Error:", error);
                });
        });
    </script>

</body>
</html>
