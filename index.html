<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooldiy Login</title>
</head>
<body>

    <h1>Login to Tooldiy</h1>
    <button id="login">Login with Google</button>
    <button id="logout" style="display: none;">Logout</button>
    <p id="user-info"></p>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-auth.js";

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCbwlEKSpafGS7wpiNhyA-iFsRoutQ66ag",
            authDomain: "tooldiy-7f7ca.firebaseapp.com",
            projectId: "tooldiy-7f7ca",
            storageBucket: "tooldiy-7f7ca.firebasestorage.app",
            messagingSenderId: "631428738593",
            appId: "1:631428738593:web:b38a813d10cbfcd626fd60"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth();
        const provider = new GoogleAuthProvider();

        // Login with Google
        document.getElementById("login").addEventListener("click", () => {
            signInWithPopup(auth, provider)
                .then((result) => {
                    const user = result.user;
                    document.getElementById("user-info").innerText = `Hello, ${user.displayName}`;
                    document.getElementById("login").style.display = "none";
                    document.getElementById("logout").style.display = "block";
                })
                .catch((error) => {
                    console.error("Login Error:", error);
                });
        });

        // Logout
        document.getElementById("logout").addEventListener("click", () => {
            signOut(auth)
                .then(() => {
                    document.getElementById("user-info").innerText = "";
                    document.getElementById("login").style.display = "block";
                    document.getElementById("logout").style.display = "none";
                })
                .catch((error) => {
                    console.error("Logout Error:", error);
                });
        });
    </script>

</body>
</html>
