<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ivaan's Search</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            padding: 10px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #333;
            color: white;
            padding: 15px;
            font-size: 18px;
        }
        .settings-icon {
            cursor: pointer;
            font-size: 20px;
        }
        #search-container {
            display: flex;
            gap: 10px;
            padding: 10px;
            background: #f1f1f1;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        #search-container input, #search-container select, #search-container button {
            padding: 8px;
            font-size: 16px;
        }
        #items-list {
            list-style: none;
            margin-top: 10px;
        }
        .item {
            padding: 10px;
            border: 1px solid #ddd;
            margin: 5px 0;
            background: white;
        }
        .item a {
            color: blue;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>ivaansri1359</h1>
        <span class="settings-icon">⚙️</span>
    </header>

    <div id="search-container">
        <input type="text" id="search" placeholder="Search..." onkeyup="liveSearch()">
        <select id="filter">
            <option value="name">Name</option>
            <option value="description">Description</option>
            <option value="type">Type</option>
        </select>
        <button onclick="liveSearch()">Go</button>
    </div>

    <ul id="items-list">
        <li class="item" data-name="python" data-description="learn python" data-type="course">
            <strong>Python</strong> - Learn Python (Course) - 
            <a href="https://example.com" target="_blank">Go</a>
        </li>
        <li class="item" data-name="javascript" data-description="learn javascript" data-type="course">
            <strong>JavaScript</strong> - Learn JavaScript (Course) - 
            <a href="https://example.com" target="_blank">Go</a>
        </li>
        <li class="item" data-name="html" data-description="learn html" data-type="tutorial">
            <strong>HTML</strong> - Learn HTML (Tutorial) - 
            <a href="https://example.com" target="_blank">Go</a>
        </li>
    </ul>

    <script>
        function liveSearch() {
            let input = document.getElementById("search").value.toLowerCase();
            let filter = document.getElementById("filter").value;
            let items = document.querySelectorAll(".item");

            items.forEach(item => {
                let value = item.dataset[filter].toLowerCase();
                if (value.includes(input)) {
                    item.style.display = "block";
                } else {
                    item.style.display = "none";
                }
            });
        }
    </script>

</body>
</html>
