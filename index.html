<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ivaansri1359</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }
        body {
            background: #f8f8f8;
            padding: 20px;
        }
        /* Sticky Header with Search Bar */
        .header {
            position: sticky;
            top: 0;
            left: 0;
            width: 100%;
            background: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            z-index: 101;
        }
        .title {
            font-size: 18px;
            font-weight: bold;
        }
        .search-bar {
            flex: 1;
            margin-left: 10px;
            padding: 8px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
        }
        /* Gallery */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .title {
            font-size: 18px;
            font-weight: bold;
        }
        .desc {
            color: #666;
            margin: 5px 0;
        }
        .link {
            display: inline-block;
            margin-top: 10px;
            text-decoration: none;
            color: white;
            background: #007bff;
            padding: 5px 10px;
            border-radius: 5px;
        }
        .link:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">Ivaansri1359</div>
        <input type="text" class="search-bar" id="search" placeholder="Search..." oninput="filterItems()">
    </div>

    <div class="gallery" id="gallery">
        <div class="card" data-title="Youtube">
            <div class="title">Youtube</div>
            <div class="desc">@ivaansri1359</div>
            <a href="https://www.youtube.com/@ivaansri1359?sub_confirmation=1" class="link">Subscribe</a> <span> Page </span>
        </div>
    </div>

    <script>
        function filterItems() {
            let input = document.getElementById("search").value.toLowerCase();
            let cards = document.querySelectorAll(".card");
            cards.forEach(card => {
                let title = card.getAttribute("data-title").toLowerCase();
                card.style.display = title.includes(input) ? "block" : "none";
            });
        }
    </script>

</body>
</html>
