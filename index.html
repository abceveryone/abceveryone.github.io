<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToolDIY</title>
    <style>
        * {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f4f4f4;
        }
        .popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            text-align: center;
            display: block;
        }
        .popup img {
            width: 50px;
            height: 50px;
        }
        .popup h2 {
            margin: 10px 0;
        }
        .popup button {
            background: #ff0000;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 10px;
        }
        .popup button:hover {
            background: #cc0000;
        }
    </style>
</head>
<body>

    <div id="popup" class="popup">
        <img src="https://www.svgrepo.com/show/303198/youtube-icon-logo.svg" alt="YouTube Logo">
        <h2>@ivaansri1359</h2>
        <p>Subscribers: <span id="subs">Loading...</span></p>
        <p>Views: <span id="views">Loading...</span></p>
        <button onclick="closePopup()">Continue Service</button>
    </div>

    <script>
        function closePopup() {
            document.getElementById("popup").style.display = "none";
        }

        async function fetchYTStats() {
            try {
                let response = await fetch("https://scraperapi.com?api_key=YOUR_SCRAPER_API_KEY&url=https://www.youtube.com/@ivaansri1359/about");
                let text = await response.text();

                let subsMatch = text.match(/"subscriberCountText":\{"simpleText":"(.*?) subscribers"/);
                let viewsMatch = text.match(/"viewCountText":\{"simpleText":"(.*?) views"/);

                if (subsMatch && viewsMatch) {
                    document.getElementById("subs").textContent = subsMatch[1];
                    document.getElementById("views").textContent = viewsMatch[1];
                } else {
                    document.getElementById("subs").textContent = "Error";
                    document.getElementById("views").textContent = "Error";
                }
            } catch (error) {
                console.error("Error fetching YouTube stats:", error);
            }
        }

        fetchYTStats();
    </script>

</body>
</html>
